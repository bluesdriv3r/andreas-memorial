$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'memorial'
layer: 'application'
language: 'javascript'

# System toolchain (Moon manages nothing), `inputs: []` so no task hashes the whole
# workspace, and nothing cached. Tasks run in the project root. Arguments after `--`
# are forwarded, e.g.:
#   moon run memorial:download -- ~/Desktop/slideshow
tasks:
  # Python venv with the MkDocs build tools, plus the npm dev dependencies for the
  # offline tests. Safe to re-run after requirements.txt or package.json change.
  setup:
    script: 'python3 -m venv .venv && .venv/bin/pip install -r requirements.txt && npm install'
    toolchain: 'system'
    inputs: []
    options:
      cache: false

  # Admin logins into terraform/auth.auto.tfvars.json. Prompts, hence interactive:
  #   moon run memorial:set-password -- <username> [--generate]
  # Takes effect with `terraform apply`.
  set-password:
    command: './set-password.sh'
    toolchain: 'system'
    inputs: []
    options:
      cache: false
      interactive: true
      runInCI: false

  # Local inspection build into site/. Title and footer fall back
  # to neutral defaults; publish.sh injects the real ones from Terraform.
  build:
    command: '.venv/bin/mkdocs'
    args: ['build', '--clean', '--strict']
    toolchain: 'system'
    inputs: []
    options:
      cache: false

  # Preview with live reload on http://127.0.0.1:8001.
  # There is no API locally, so the page reports the upload service as unreachable.
  serve:
    command: '.venv/bin/mkdocs'
    args: ['serve', '-a', '127.0.0.1:8001']
    toolchain: 'system'
    preset: 'server'
    inputs: []

  # Show pending infrastructure changes. Read-only.
  infra-plan:
    command: 'terraform'
    args: ['-chdir=terraform', 'plan']
    toolchain: 'system'
    inputs: []
    options: &stateful
      cache: false
      runInCI: false

  # Apply infrastructure and Lambda changes. Terraform shows the plan and waits for
  # "yes": interactive passes that prompt through, and there is deliberately no
  # -auto-approve, so the task never applies unreviewed. Never runs in CI.
  infra-apply:
    command: 'terraform'
    args: ['-chdir=terraform', 'apply']
    toolchain: 'system'
    inputs: []
    options:
      cache: false
      interactive: true
      runInCI: false

  # Build, sync to S3 with --delete, invalidate, then fail unless /api/config
  # answers with uploads open.
  publish:
    command: './publish.sh'
    toolchain: 'system'
    inputs: []
    options: *stateful

  # Post-deploy checks. MEMORIAL_USER='…' MEMORIAL_PASSWORD='…' add the admin login checks and a
  # real end-to-end upload. Exits non-zero on failure.
  verify:
    command: './verify.sh'
    toolchain: 'system'
    inputs: []
    options: *stateful

  # Offline tests for the API function (mock S3, SigV4 cross-check). Needs
  # `npm install` once for the AWS SDK dev dependencies.
  test:
    command: 'npm'
    args: ['test']
    toolchain: 'system'
    inputs: []
    options:
      cache: false

  # Fetch all uploads into a folder (default ~/Desktop/slideshow) and convert HEIC.
  download:
    command: './download.sh'
    toolchain: 'system'
    inputs: []
    options: *stateful
