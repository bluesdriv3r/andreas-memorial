$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'memorial'
layer: 'application'
language: 'javascript'

# System toolchain (Moon manages nothing), `inputs: []` so no task hashes the whole
# workspace, and nothing cached. Tasks run in the project root. Arguments after `--`
# are forwarded, e.g.:
#   moon run memorial:download -- ~/Desktop/slideshow
tasks:
  # Local inspection build into site/. Title and footer fall back
  # to neutral defaults; publish.sh injects the real ones from Terraform.
  build:
    command: '.venv/bin/mkdocs'
    args: ['build', '--clean', '--strict']
    toolchain: 'system'
    inputs: []
    options:
      cache: false

  # Preview with live reload on http://127.0.0.1:8001.
  # There is no API locally, so the page reports the upload service as unreachable.
  serve:
    command: '.venv/bin/mkdocs'
    args: ['serve', '-a', '127.0.0.1:8001']
    toolchain: 'system'
    preset: 'server'
    inputs: []

  # Show pending infrastructure changes. Read-only. There is deliberately no
  # `infra-apply` task — applying stays a deliberate act with the plan on screen.
  infra-plan:
    command: 'terraform'
    args: ['-chdir=terraform', 'plan']
    toolchain: 'system'
    inputs: []
    options: &stateful
      cache: false
      runInCI: false

  # Build, sync to S3 with --delete, invalidate, then fail unless /api/config
  # answers with uploads open.
  publish:
    command: './publish.sh'
    toolchain: 'system'
    inputs: []
    options: *stateful

  # Post-deploy checks. MEMORIAL_CREDENTIAL='user:pass' adds the admin checks and a
  # real end-to-end upload. Exits non-zero on failure.
  verify:
    command: './verify.sh'
    toolchain: 'system'
    inputs: []
    options: *stateful

  # Offline tests for the API function (mock S3, SigV4 cross-check). Needs
  # `npm install` once for the AWS SDK dev dependencies.
  test:
    command: 'npm'
    args: ['test']
    toolchain: 'system'
    inputs: []
    options:
      cache: false

  # Fetch all uploads into a folder (default ~/Desktop/slideshow) and convert HEIC.
  download:
    command: './download.sh'
    toolchain: 'system'
    inputs: []
    options: *stateful
